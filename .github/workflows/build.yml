name: Build

on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ['*.md']
    branches: ['master']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.draft == false
    # A third party's workflow, pinned to a commit. The actions it calls still track @master,
    # tolerable only because a PR build receives no secrets: it signs with a throwaway key.
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@872d18c8e5836a6b10bc00e3566d5c331a534348

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canary.s9pk

      - name: Install start-cli
        uses: Start9Labs/start-technologies/.github/actions/install-start-cli@872d18c8e5836a6b10bc00e3566d5c331a534348

      - name: Install unsquashfs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools

      - name: Check the manifest
        run: |
          start-cli s9pk inspect canary.s9pk manifest > manifest.json
          jq '{version, gitHash, osVersion, sdkVersion}' manifest.json
          hash=$(jq -r .gitHash manifest.json)
          if [ "$hash" != "$GITHUB_SHA" ]; then
            echo "::error::gitHash $hash is not the commit that was built, $GITHUB_SHA"
            exit 1
          fi
          for img in backend frontend; do
            if ! jq -e --arg i "$img" '.images[$i].arch | sort == ["aarch64", "x86_64"]' manifest.json > /dev/null; then
              echo "::error::the $img image is not built for both aarch64 and x86_64"
              exit 1
            fi
          done

      - name: Extract every image
        run: |
          mkdir rootfs
          for arch in aarch64 x86_64; do
            for img in backend frontend; do
              start-cli s9pk inspect canary.s9pk cat "images/$arch/$img.squashfs" > "$img-$arch.squashfs"
              unsquashfs -q -no-progress -d "rootfs/$img-$arch" "$img-$arch.squashfs"
            done
          done

      - name: Check the backend trust store
        run: |
          # Public-key fingerprints of emSign ECC Root CA - G3 and AAA Certificate Services, the
          # roots the leaked emSign intermediates chain to.
          distrusted="8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782 bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3"
          # ISRG Root X1. It must be found, or the fingerprints are not being read.
          control=0b9fa5a59eed715c26c1020c711b4f6ec42d58b0015e14337a39dad301c5afc3
          for arch in aarch64 x86_64; do
            certs=$(mktemp -d)
            awk -v d="$certs" '/BEGIN CERTIFICATE/ {n++; f = sprintf("%s/%04d.pem", d, n)} f {print > f} /END CERTIFICATE/ {close(f); f = ""}' \
              "rootfs/backend-$arch/etc/ssl/certs/ca-certificates.crt"
            for c in "$certs"/*.pem; do
              openssl x509 -in "$c" -noout -pubkey | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1
            done > "spki-$arch.txt"
            echo "$arch: $(wc -l < "spki-$arch.txt") certificates"
            # A certificate openssl cannot read hashes as empty input and would otherwise pass.
            if grep -qx e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 "spki-$arch.txt"; then
              echo "::error::$arch: a certificate in the store could not be read"
              exit 1
            fi
            if ! grep -qx "$control" "spki-$arch.txt"; then
              echo "::error::$arch: the control root is missing, so this check proves nothing"
              exit 1
            fi
            for key in $distrusted; do
              if grep -qx "$key" "spki-$arch.txt"; then
                echo "::error::$arch: the system store trusts a distrusted root ($key)"
                exit 1
              fi
            done
          done

      - name: Scan every image
        run: |
          for root in rootfs/*; do
            echo "::group::$root"
            docker run --rm -v "$PWD/$root:/rootfs:ro" -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
              rootfs /rootfs --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1 --scanners vuln
            echo "::endgroup::"
          done
